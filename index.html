<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sepire Statement Explorer</title>
    <meta name="description" content="See how Sepire turns a static PDF retirement statement into an interactive, bilingual, accessible statement of record — powered by one API payload." />
    <meta name="theme-color" content="#E5833B" />
    <link rel="icon" type="image/svg+xml" href="./brand/sepire-mark.svg" />
    <link rel="icon" type="image/png" href="./brand/favicon-64.png" />
    <script>
      // Apply the saved or OS theme before first paint.
      (function () {
        try {
          var t = localStorage.getItem('sepire-explorer-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
